# Local password file, rendered from .env into the ignored runtime directory by
# the trino-password-setup one-shot service. Hashes are bcrypt; no plaintext
# password is written anywhere in the stack.
#
# This is a development identity store, not PSU SSO. It exists so that a
# username is something a client proves rather than something it claims. SSO
# replaces this file, it does not extend it.
password-authenticator.name=file
file.password-file=/var/trino/data/password.db
file.refresh-period=5s
