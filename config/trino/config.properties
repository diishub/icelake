coordinator=true
node-scheduler.include-coordinator=true
query.max-memory=2GB
query.max-memory-per-node=1GB
query.max-execution-time=5m
query.max-run-time=10m
http-server.process-forwarded=true

# Until now Trino had no authenticator: it believed whatever username a client
# asserted, which is why every port had to stay on loopback and why the stack
# could not be pointed at real data. Password authentication requires TLS, so
# both arrive together.
#
# The HTTP port stays open for the discovery URI only. With PASSWORD
# authentication and allow-insecure-over-http left at its default of false,
# Trino refuses an authenticated request that arrives over plain HTTP, so this
# port is not a way around the authenticator.
http-server.http.port=8080
discovery.uri=http://trino:8080

http-server.https.enabled=true
http-server.https.port=8443
# Self-signed, generated into the ignored runtime directory by the
# trino-tls-setup one-shot service. A real certificate belongs to the
# perimeter work, not to a single-host development stack.
http-server.https.keystore.path=/var/trino/data/tls/trino.p12
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}

http-server.authentication.type=PASSWORD
# Single node today, but the secret is required as soon as authentication is
# on and a second node appears; setting it now means that day is not an outage.
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
