# File-based Hive metastore (undocumented but real Trino option, verified
# against trinodb/trino source/discussions — not the AWS Glue/Thrift options
# the main docs page covers). Used only as an ephemeral staging area to
# bridge file-based sources into Iceberg (polaris catalog) via Trino SQL,
# since NiFi's own Iceberg processors cannot write to this stack's Polaris
# (verified: RESTIcebergCatalog fails on the Polaris-Realm header, and
# PutIcebergRecord throws UnsupportedOperationException regardless of
# credentials, on NiFi 2.10.0). Schema: raw_staging only, one external table
# per ingested file, dropped (metadata only, not the data) after the Trino
# INSERT INTO polaris.raw completes.
connector.name=hive
hive.metastore=file
# Trino's newer local-filesystem plugin uses the local:// scheme, not file://
# -- a file:// URI here is silently accepted but jailed under /tmp inside the
# container (writes land at /tmp/var/trino/data/... instead), which is *not*
# an error, just silent data loss on container recreate. Verified live: with
# file://, CREATE SCHEMA reports success but the marker file shows up under
# /tmp, and a subsequent SHOW SCHEMAS doesn't see it either.
#
# local.location (below) is the real root directory (bare path, not a
# local:// URI -- that form fails catalog load with "Invalid configuration
# property local.location: file does not exist", verified live). Every
# local:// path elsewhere in this catalog resolves *relative to* that root,
# so hive.metastore.catalog.dir must be just the bare root reference
# (local:///), NOT the same absolute path repeated -- repeating it double-
# nests writes under <root>/var/trino/data/hive-metastore/ instead of at
# <root> itself (verified live, cost one schema's data during debugging).
hive.metastore.catalog.dir=local:///
hive.non-managed-table-creates-enabled=true
# Also required: without fs.local.enabled, CREATE SCHEMA on a brand-new empty
# metastore dir fails outright with "Could not read database schema from
# .../.raw_staging.trinoSchema" (verified live against Trino 483).
fs.local.enabled=true
local.location=/var/trino/data/hive-metastore

fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
# RustFS has no real AWS region, but Trino's S3 filesystem (AWS SDK v2) always
# requires one to be set -- placeholder, matches the region used elsewhere in
# compose.yaml for RustFS (polaris service's AWS_REGION). Verified: omitting
# this crashes catalog load with SdkClientException "Unable to load region".
s3.region=us-west-2
s3.path-style-access=true
s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}
