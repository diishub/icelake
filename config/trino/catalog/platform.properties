# The ingestion control plane, exposed read-only so the operations dashboard
# reads run history through the same engine and the same authorization path as
# every other query. The alternative -- pointing Superset straight at
# PostgreSQL -- would create a second route to data that OPA never sees.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/platform
# platform_trino holds SELECT and nothing else (config/platform/002-roles.sql),
# so read-only here is enforced by the database, not only by policy.
connection-user=platform_trino
connection-password=${ENV:PLATFORM_READ_PASSWORD}
