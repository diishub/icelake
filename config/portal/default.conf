server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Anonymous users only learn whether the report UI responds. The upstream
    # endpoint returns a two-byte "OK" and does not disclose service versions.
    location = /api/health/reports {
        access_log off;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $reports_upstream http://superset:8088;
        proxy_pass $reports_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host superset;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Vary;
        proxy_hide_header Content-Type;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. {
        deny all;
    }
}
