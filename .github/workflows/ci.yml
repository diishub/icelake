# Continuous integration for the PSU Data Hub lakehouse stack.
#
# Four independent jobs, split so a fast, isolated check reports back in
# seconds rather than waiting behind the heavy one:
#
#   policy           OPA rego tests. No compose stack, no Docker network.
#   auth-typecheck   TypeScript typecheck for services/auth. No compose stack.
#   guardrail        The source-host guardrail's own acceptance tests.
#                    No compose stack -- it exercises the shell script
#                    directly against temporary copies of the list files.
#   stack            Brings up the full docker compose stack against
#                    .env.ci and runs every test-*.sh that needs it.
#
# Deliberately excluded: scripts/test-dotblue-dashboard.sh. Its own header
# says why -- it proves that a specific ingestion run carried no personal
# data out of a production database, which means it depends on files under
# data/incoming that hold real extracts and must never be committed to this
# repository or reach a CI runner. That test is run by hand, by whoever
# operates that ingestion, against that data, not by this workflow.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run policy test suite
        run: |
          docker run --rm -v "${{ github.workspace }}/config/opa:/policies:ro" \
            openpolicyagent/opa:1.17.0 test /policies

  auth-typecheck:
    name: services/auth typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/auth/package-lock.json
      - working-directory: services/auth
        run: npm ci --no-audit --no-fund
      - working-directory: services/auth
        run: npx tsc --noEmit

  guardrail:
    name: Source guardrail acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh config/guardrail/*.sh && ./scripts/test-source-guardrail.sh

  stack:
    name: Full-stack tests
    runs-on: ubuntu-latest
    # The heaviest job here: Postgres, RustFS, Polaris, Trino, OPA, NiFi and
    # Superset all running together. ubuntu-latest gives 7GB RAM / 2 cores; if
    # this job starts failing with containers killed rather than a specific
    # test failure, that is the ceiling being hit and the fix is a larger
    # runner, not a code change.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh config/*/*.sh || true

      - name: Prepare runtime directories
        run: |
          mkdir -p runtime/rustfs runtime/postgres runtime/redis runtime/qdrant runtime/trino runtime/superset runtime/source-sim
          chmod -R 777 runtime

      - name: Use the CI environment fixture
        run: cp .env.ci .env

      - name: Build the auth service image
        run: docker compose --profile auth build psu-auth

      - name: Start the stack
        run: docker compose --profile auth up -d

      # docker compose up -d returns as soon as containers are *created*, not
      # once the healthchecked ones report healthy, and does not itself wait
      # for the one-shot init containers (trino-tls-setup, polaris-bootstrap,
      # ...) either -- those are ordered by depends_on/service_completed_
      # successfully already encoded in compose.yaml, so a service that starts
      # at all has already waited for the setup steps it declared it needs.
      #
      # Polling docker inspect's own Health.Status reuses each service's real
      # healthcheck (compose.yaml) instead of a second, separately-maintained
      # version of the same check -- Trino's in particular authenticates with
      # a real credential against /v1/info, which a naive unauthenticated curl
      # here would have gotten wrong (401, forever, never 200).
      - name: Wait for the healthchecked services
        run: |
          set -eu
          for service in postgres rustfs polaris redis source-sim trino superset; do
            container="$(docker compose ps -q "${service}")"
            if [ -z "${container}" ]; then
              echo "no container for service: ${service}" >&2
              exit 1
            fi
            ready=0
            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "${container}" 2>/dev/null || echo "")"
              if [ "${status}" = "healthy" ]; then
                echo "ready: ${service}"
                ready=1
                break
              fi
              sleep 10
            done
            if [ "${ready}" -ne 1 ]; then
              echo "TIMED OUT waiting for: ${service} (last status: ${status:-unknown})" >&2
              docker compose logs --tail 100 "${service}" >&2 || true
              exit 1
            fi
          done

      - name: Apply the control-plane migrations
        run: docker compose run --rm platform-migrate

      - name: Reload nginx (picks up the auth proxy config already on disk)
        run: docker compose exec psu-portal nginx -s reload

      # NiFi has no Docker-level healthcheck in compose.yaml (nothing else in
      # this stack depends on it being up before it starts them), so unlike
      # the services waited for above, nothing has confirmed its REST API is
      # actually answering yet. Retrying the exact access-token request
      # scripts/nifi/build-ingest-flow.container.sh itself makes -- not a
      # different, unverified endpoint -- means this either succeeds for the
      # same reason the real call would, or times out the same way it would.
      - name: Wait for the NiFi API
        run: |
          set -eu
          # Read from .env rather than hardcoded here, so this step tracks
          # whatever .env.ci actually sets instead of a second copy of it
          # that could quietly drift out of sync.
          nifi_user="$(grep '^NIFI_USERNAME=' .env | cut -d= -f2-)"
          nifi_password="$(grep '^NIFI_PASSWORD=' .env | cut -d= -f2-)"
          for _ in $(seq 1 30); do
            if docker compose exec -T nifi curl -sf --insecure -X POST \
                 https://localhost:8443/nifi-api/access/token \
                 --data-urlencode "username=${nifi_user}" \
                 --data-urlencode "password=${nifi_password}" >/dev/null 2>&1; then
              echo "ready: nifi"
              exit 0
            fi
            sleep 10
          done
          echo "TIMED OUT waiting for: nifi" >&2
          docker compose logs --tail 100 nifi >&2 || true
          exit 1

      # test-ingest-pipeline.sh and test-maintenance.sh both read tables the
      # ingestion run itself creates (polaris.raw.sim_hr_employee and
      # friends), so unlike every other suite here they need the flow built
      # and fired once first -- the same two commands a person sets this
      # stack up with, not a CI-specific shortcut.
      - name: Build the ingestion flow
        run: ./scripts/build-ingest-flow.sh
      - name: Run the ingestion flow once
        run: ./scripts/run-ingest-once.sh

      # One step per script: a failure names itself in the Checks tab instead
      # of scrolling through one combined log to find which of twelve suites
      # broke.
      - name: test-platform-registry.sh
        run: ./scripts/test-platform-registry.sh
      - name: test-identity.sh
        run: ./scripts/test-identity.sh
      - name: test-source-sim.sh
        run: ./scripts/test-source-sim.sh
      - name: test-ingest-pipeline.sh
        run: ./scripts/test-ingest-pipeline.sh
      - name: test-maintenance.sh
        run: ./scripts/test-maintenance.sh
      - name: test-ops-dashboard.sh
        run: ./scripts/test-ops-dashboard.sh
      - name: test-trino-auth.sh
        run: ./scripts/test-trino-auth.sh
      - name: test-superset-oauth.sh
        run: ./scripts/test-superset-oauth.sh
      - name: test-password-login.sh
        run: ./scripts/test-password-login.sh
      - name: test-portal-catalog.sh
        run: ./scripts/test-portal-catalog.sh
      - name: test-portal-i18n.sh
        run: ./scripts/test-portal-i18n.sh
      - name: test-portal-embed.sh
        run: ./scripts/test-portal-embed.sh
      - name: test-data-upload.sh
        run: ./scripts/test-data-upload.sh
      - name: test-review-upload.sh
        run: ./scripts/test-review-upload.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile auth down -v
